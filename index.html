<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Interactive Coding Project Home</title>
    <link href="styles.css" type="text/css" rel="stylesheet" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <header>
      <nav>
        <div class="desktopNav">
        <ul>
          <li>
            <a href="index.html"><img src="images/logo.svg" /></a>
          </li>
          <div class="nav-right">
              <li><a href="" class="btn-1">Our Cats</a></li>
              <li><a href="" class="btn-2">About Us</a></li>
              <li><a href="" class="btn-3">Our Menu</a></li>
              <li><a href="" class="btn-4">Reservations</a></li>
            <li><a href="" class="nav-button">Order Now</a></li>
          </div>
        </ul>
        </div>
        </div>
        <div class="mobileNav">
          <ul>
            <li>
            <a href="index.html"><img src="images/logo.svg" /></a>
          </li>
          <li>
            <img src="images/hamburger.svg" alt="">
          </li>
          </ul>
        </div>
      </nav>
    </header>
    <main>
      <div class="hero-left">
        <h1>Where Cats and Coffee Unite</h1>
        <img src="images/latteArt.svg" />
        <img class="button-animation" src="images/catButton.svg"/>
        <a href="" class="hero-button">Order Now</a>
          <div class="hideCat"></div>
      </div>
      <div class="hero-right">
        <img src="images/mainCatImage.svg" />
      </div>
    </main>
    <!--MODAL STARTS HERE-->
    <div class="modal" id="modal">
      <div class="modal-close-btn">
        <button data-close-button class="close-button">&times;</button>
      </div>
      <div class="modal-header">
        <div class="title">Buy One, Get One Free!</div>
      </div>
      <div class="modal-body">
        Get a free drink of equal or lesser value with the purchase of any
        drink!
      </div>
      <img src="images/coffeeCups.svg" />
      <div class="modal-button-left">
        <button data-close-button class="close-button">Get the Offer</button>
      </div>
      <div class="modal-button-right">
        <button data-close-button class="close-button">No Thanks</button>
      </div>
    </div>
    <div id="overlay"></div>
  </body>
</html>
